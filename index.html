<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Гусь - установка</title>
  <style>
    :root { color-scheme: dark; --bg: #101217; --panel: #191d26; --text: #f4f7fb; --muted: #a8b0bf; --line: #303644; --accent: #31a5ff; --ok: #47d18c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", Arial, sans-serif; background: radial-gradient(circle at 15% 10%, rgba(49,165,255,.18), transparent 32%), linear-gradient(135deg, #090b10, var(--bg)); color: var(--text); display: grid; place-items: center; padding: 32px 16px; }
    main { width: min(760px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 28px; box-shadow: 0 22px 70px rgba(0,0,0,.34); }
    h1 { margin: 0 0 8px; font-size: clamp(34px, 7vw, 62px); line-height: .95; font-weight: 800; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; }
    .version { color: var(--text); font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0; }
    a { color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 13px 16px; display: inline-flex; justify-content: center; align-items: center; gap: 10px; min-width: 180px; font-weight: 700; }
    a.primary { background: #176cc1; border-color: #2689eb; }
    a:hover { border-color: var(--accent); }
    .steps { display: grid; gap: 10px; margin-top: 18px; }
    .step { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; color: var(--muted); }
    .step strong { color: var(--ok); margin-right: 8px; }
    footer { margin-top: 18px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Гусь</h1>
    <p>Установщик программы. Текущая версия: <span class="version">v1.13.17</span>.</p>
    <div class="actions">
      <a class="primary" href="https://danzedark.github.io/gus-updates/Gus-Web-Setup.bat" download>Скачать установщик</a>
      <a href="https://danzedark.github.io/gus-updates/VERSION.txt">Проверить версию</a>
    </div>
    <div class="steps">
      <div class="step"><strong>1.</strong>Скачай установщик на рабочий ПК.</div>
      <div class="step"><strong>2.</strong>Запусти файл и выбери папку установки.</div>
      <div class="step"><strong>3.</strong>После установки открывай программу через ярлык на рабочем столе.</div>
    </div>
    <footer>Собрано: 2026-07-10 15:00:00</footer>
  </main>
</body>
</html>
